<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎬 Générateur de vidéos IA</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="container">
    <header>
      <h1>🎬 Générateur de vidéos IA</h1>
      <p class="subtitle">Décris ta vidéo, l'IA s'occupe du reste.</p>
      <div id="health" class="health"></div>
    </header>

    <section class="form-card">
      <label for="provider">Fournisseur</label>
      <select id="provider">
        <option value="replicate">⚡ Replicate (rapide)</option>
        <option value="agnes">🆓 Agnes AI (gratuit, lent)</option>
      </select>

      <div id="replicateModelBox">
        <label for="replicateModel">Modèle Replicate</label>
        <select id="replicateModel">
          <option value="kwaivgi/kling-v2.1">🎨 Kling v2.1 — image supportée (~0,30 €/vidéo)</option>
          <option value="minimax/video-01">💰 Minimax — économique (~0,05 €/vidéo, image ignorée)</option>
        </select>
      </div>

      <label for="prompt">Prompt</label>
      <textarea
        id="prompt"
        rows="5"
        placeholder="Ex : Un chat noir dans un jardin fleuri, lumière dorée du matin, caméra lente..."
      ></textarea>

      <label for="imageInput">📎 Image de référence (optionnel)</label>
      <input type="file" id="imageInput" accept="image/*" />
      <div id="imagePreview" class="image-preview"></div>
      <p class="hint">
        <strong>Replicate (Kling) :</strong> l'image guide la vidéo automatiquement.<br>
        <strong>Replicate (Minimax) :</strong> l'image est <em>ignorée</em>.<br>
        <strong>Agnes :</strong> ajoute <code>&lt;Picture 1&gt;</code> dans ton prompt pour la référencer.
      </p>

      <button id="generateBtn">🚀 Générer la vidéo</button>
      <div id="status" class="status"></div>
    </section>

    <section id="result" class="result hidden">
      <h2>Résultat</h2>
      <video id="video" controls playsinline></video>
      <a id="downloadLink" class="download" download="video.mp4">⬇️ Télécharger</a>
    </section>
  </main>

  <script src="/static/script.js"></script>
</body>
</html>
