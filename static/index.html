<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎬 Générateur de vidéos IA</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="container">
    <header>
      <h1>🎬 Générateur de vidéos IA</h1>
      <p class="subtitle">Décris ta vidéo, l'IA s'occupe du reste.</p>
      <div id="health" class="health"></div>
    </header>

    <section class="form-card">
      <label for="provider">Fournisseur</label>
      <select id="provider">
        <option value="replicate">⚡ Replicate (rapide, payant ~0,05€)</option>
        <option value="agnes">🆓 Agnes AI (gratuit, 15-25 min)</option>
      </select>

      <label for="prompt">Prompt</label>
      <textarea
        id="prompt"
        rows="5"
        placeholder="Ex : Un chat noir dans un jardin fleuri, lumière dorée du matin, caméra lente..."
      ></textarea>

      <label for="imageInput">📎 Image de référence (optionnel)</label>
      <input type="file" id="imageInput" accept="image/*" />
      <div id="imagePreview" class="image-preview"></div>
      <p class="hint">Pour Agnes : utilise <code>&lt;Picture 1&gt;</code> dans ton prompt.</p>

      <button id="generateBtn">🚀 Générer la vidéo</button>
      <div id="status" class="status"></div>
    </section>

    <section id="result" class="result hidden">
      <h2>Résultat</h2>
      <video id="video" controls playsinline></video>
      <a id="downloadLink" class="download" download="video.mp4">⬇️ Télécharger</a>
    </section>
  </main>

  <script src="/static/script.js"></script>
</body>
</html>
