<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎬 Générateur de vidéos IA</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="container">
    <header>
      <h1>🎬 Générateur de vidéos IA</h1>
      <p class="subtitle">Décris ta vidéo, l'IA s'occupe du reste.</p>
      <div id="health" class="health"></div>
    </header>

    <section class="form-card">
      <label for="prompt">Prompt</label>
      <textarea
        id="prompt"
        rows="5"
        placeholder="Ex : <Picture 1> marche dans un jardin fleuri, caméra lente..."
      ></textarea>

      <label for="imageInput">📎 Images de référence (max 5, optionnel)</label>
      <input type="file" id="imageInput" accept="image/*" multiple />
      <div id="imagePreview" class="image-preview"></div>
      <p class="hint">Utilise <code>&lt;Picture 1&gt;</code>, <code>&lt;Picture 2&gt;</code>… dans ton prompt pour référencer les images.</p>

      <details>
        <summary>Paramètres avancés</summary>
        <label for="model">Modèle Agnes AI</label>
        <input id="model" type="text" placeholder="agnes-video-2.5-flash" />

        <label for="params">Paramètres supplémentaires (JSON)</label>
        <textarea id="params" rows="3" placeholder='{"seconds": "5", "aspect_ratio": "16:9"}'></textarea>
      </details>

      <button id="generateBtn">🚀 Générer la vidéo</button>
      <div id="status" class="status"></div>
    </section>

    <section id="result" class="result hidden">
      <h2>Résultat</h2>
      <video id="video" controls playsinline></video>
      <a id="downloadLink" class="download" download="video.mp4">⬇️ Télécharger</a>
    </section>
  </main>

  <script src="/static/script.js"></script>
</body>
</html>
