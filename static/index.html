<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎬 Générateur de vidéos IA</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="container">
    <header>
      <h1>🎬 Générateur de vidéos IA</h1>
      <p class="subtitle">Décris ta vidéo, l'IA s'occupe du reste.</p>
      <div id="health" class="health"></div>
    </header>

    <section class="form-card">
      <label for="prompt">Prompt</label>
      <textarea
        id="prompt"
        rows="5"
        placeholder="Ex : Un chat astronaute flottant dans l'ISS, caméra lente, lumière dorée, style cinématographique..."
      ></textarea>

      <details>
        <summary>Paramètres avancés</summary>
        <label for="model">Modèle Replicate</label>
        <input id="model" type="text" placeholder="minimax/video-01" />

        <label for="params">Paramètres supplémentaires (JSON)</label>
        <textarea id="params" rows="3" placeholder='{"duration": 5}'></textarea>
      </details>

      <button id="generateBtn">🚀 Générer la vidéo</button>
      <div id="status" class="status"></div>
    </section>

    <section id="result" class="result hidden">
      <h2>Résultat</h2>
      <video id="video" controls playsinline></video>
      <a id="downloadLink" class="download" download="video.mp4">⬇️ Télécharger</a>
    </section>
  </main>

  <script src="/static/script.js"></script>
</body>
</html>
